<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Nguyễn Trung Ios HEX Tool</title>


<meta name="theme-color" content="#00ff99">


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

height:100vh;

background:
radial-gradient(circle,#003333,#000);

display:flex;

justify-content:center;

align-items:center;

font-family:Arial,monospace;

color:#00ff99;

}



.box{

width:420px;

padding:30px;

background:

rgba(0,0,0,.85);

border:

1px solid #00ff99;

border-radius:25px;

box-shadow:

0 0 25px #00ff99;

text-align:center;

}



h1{

font-size:30px;

text-shadow:

0 0 15px #00ff99;

}



.sub{

color:#00ccff;

margin-bottom:25px;

}



input{

width:100%;

padding:15px;

background:#050505;

border:

1px solid #00ff99;

border-radius:12px;

color:#00ff99;

font-size:16px;

}



button{

width:100%;

padding:15px;

margin-top:15px;

border-radius:15px;

border:

1px solid #00ff99;

background:#001b1b;

color:#00ff99;

font-weight:bold;

font-size:16px;

cursor:pointer;

}



button:hover{

background:#00ff99;

color:#000;

}



#result{

margin-top:20px;

padding:15px;

border:

1px solid #00ccff;

border-radius:15px;

color:#00ccff;

}



.contact{

margin-top:25px;

padding:20px;

background:#050505;

border:

1px solid #00ccff;

border-radius:15px;

}



.contact h3{

color:#00ff99;

}



.zalo{

background:#006cff;

border-color:#00ccff;

color:white;

box-shadow:

0 0 20px #006cff;

}



.zalo:hover{

background:#00ccff;

}


a{

text-decoration:none;

}



.success{

color:#00ff99;

}


.error{

color:#ff0044;

}


</style>


</head>



<body>



<div class="box">



<h1>

☠ Nguyễn Trung Ios ☠

</h1>


<div class="sub">

CYBER HEX PATCHER v1.0

</div>



<input

id="key"

placeholder="Nhập KEY NTRUNGIOS">


<button onclick="login()">

🔓 UNLOCK TOOL

</button>



<div id="result">

SYSTEM READY...

</div>




<div class="contact">


<h3>

🔑 MUA KEY TOOL

</h3>


<p>

Liên hệ để nhận KEY sử dụng

</p>



<a href="https://zalo.me/0983647230"
target="_blank">


<button class="zalo">

💬 ZALO MUA KEY

</button>


</a>



</div>



</div>





<script>


async function login(){


let keyValue=
document.getElementById("key").value;


let result=
document.getElementById("result");



if(!keyValue){


result.innerHTML=

`
<div class="error">

❌ Chưa nhập KEY

</div>
`;

return;

}




try{


let res=
await fetch(

"/api/check-key",

{


method:"POST",


headers:{


"Content-Type":

"application/json"


},


body:JSON.stringify({

key:keyValue

})


}

);



let data=
await res.json();



if(data.success){


result.innerHTML=

`

<div class="success">

✅ KEY ACTIVE

</div>


<br>

⏳ Còn hạn:

<b>
${data.remain}
</b>

ngày


<br><br>

🚀 Đang mở TOOL...

`;



localStorage.setItem(

"NTrungIOS_KEY",

keyValue

);



}

else{


result.innerHTML=

`

<div class="error">

❌ ${data.msg}

</div>

`;

}



}

catch(e){


result.innerHTML=

`

<div class="error">

❌ Lỗi kết nối API

</div>

`;

}



}



</script>



</body>

</html>
